<p>
  The IFs Network Diagram is an interactive visualization of the internal structure of the International Futures (IFs) model. </p>
<br>
<p>
  It shows the variable and parameter relationships in IFs and how they influence one another.
</p>
<br>
<p>For more detailed instructions on using the app, visit this <a href="https://pardeewiki.du.edu/index.php?title=IFs_Network_Diagram" target="_blank">page</a>.</p>
